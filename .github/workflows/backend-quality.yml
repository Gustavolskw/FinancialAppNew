name: Backend Quality Gate

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  backend-quality:
    name: PHPCS, PHPStan and PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:v2, phpcs, phpstan

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Prepare Symfony CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=0
          APP_SECRET=test-secret
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/financial_app_test?serverVersion=16&charset=utf8
          CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
          DEFAULT_URI=http://localhost
          APP_SHARE_DIR=var/share
          EOF

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        run: find src tests -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: PHPCS
        run: phpcs --standard=phpcs.xml.dist

      - name: PHPStan
        run: phpstan analyse --configuration=phpstan.neon.dist --no-progress

      - name: PHPUnit
        run: composer test
